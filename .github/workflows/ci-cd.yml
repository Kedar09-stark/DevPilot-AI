
name: DevPilot AI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'Dockerfile'
              - 'requirements.txt'
              - '.dockerignore'
              - 'src/**'
            frontend:
              - 'frontend/**'
            deployment:
              - 'deploy-aws.sh'
              - '.github/workflows/ci-cd.yml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.deployment == 'true')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Docker Image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            149536463976.dkr.ecr.ap-south-1.amazonaws.com/devpilot-backend:latest
            149536463976.dkr.ecr.ap-south-1.amazonaws.com/devpilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            149536463976.dkr.ecr.ap-south-1.amazonaws.com/devpilot-frontend:latest
            149536463976.dkr.ecr.ap-south-1.amazonaws.com/devpilot-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Validate Deployment Script
        run: bash -n deploy-aws.sh

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.deployment == 'true')
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
        run: |
          SCRIPT_B64=$(base64 -w 0 deploy-aws.sh)

          REMOTE_COMMAND="set -e; echo '$SCRIPT_B64' | base64 -d | sudo tee /home/ubuntu/devpilot/deploy-aws.sh >/dev/null; sudo chmod +x /home/ubuntu/devpilot/deploy-aws.sh; sudo rm -f /home/ubuntu/devpilot/deploy-status; sudo -u ubuntu nohup bash /home/ubuntu/devpilot/deploy-aws.sh '$BACKEND_CHANGED' '$FRONTEND_CHANGED' >/home/ubuntu/devpilot/deploy.log 2>&1 </dev/null &"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-06a28757851cd8e78 \
            --document-name AWS-RunShellScript \
            --comment "Start DevPilot deployment $GITHUB_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment started: $COMMAND_ID"

          sleep 5

          for attempt in {1..60}; do
            CHECK_ID=$(aws ssm send-command \
              --region ap-south-1 \
              --instance-ids i-06a28757851cd8e78 \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["cat /home/ubuntu/devpilot/deploy-status 2>/dev/null || echo missing"]' \
              --query 'Command.CommandId' \
              --output text)

            sleep 3

            CHECK_STATUS=$(aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$CHECK_ID" \
              --instance-id i-06a28757851cd8e78 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            if [ "$CHECK_STATUS" = "Success" ]; then
              DEPLOY_STATUS=$(aws ssm get-command-invocation \
                --region ap-south-1 \
                --command-id "$CHECK_ID" \
                --instance-id i-06a28757851cd8e78 \
                --query 'StandardOutputContent' \
                --output text | tr -d '[:space:]')

              echo "Deployment status: $DEPLOY_STATUS"

              if [ "$DEPLOY_STATUS" = "success" ]; then
                echo "DevPilot deployment completed."
                exit 0
              fi

              if [ "$DEPLOY_STATUS" = "failed" ]; then
                echo "Deployment failed. Fetching logs..."

                aws ssm send-command \
                  --region ap-south-1 \
                  --instance-ids i-06a28757851cd8e78 \
                  --document-name AWS-RunShellScript \
                  --parameters 'commands=["cat /home/ubuntu/devpilot/deploy.log"]'

                exit 1
              fi
            fi

            sleep 10
          done

          echo "Deployment did not finish within the expected time."
          exit 1
